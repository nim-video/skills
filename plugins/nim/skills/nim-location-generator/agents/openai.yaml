interface:
  display_name: "Nim Location Generator"
  short_description: "Locations with Flux/Recraft Pro, Nano Pro or GPT 2 Medium"
  default_prompt: "Use $nim-location-generator to create a UGC background with natural light, no people, and no foreground objects; automatically choose an approved model, preferring Flux 2 Pro or Recraft V4.1 Pro."
dependencies:
  tools:
    - type: "mcp"
      value: "nim"
      description: "Nim image generation, model discovery and reference uploads"
      transport: "streamable_http"
      url: "https://mcp.nim.video/mcp"
policy:
  allow_implicit_invocation: true
