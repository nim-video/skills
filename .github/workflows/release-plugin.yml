name: Release plugin

# Builds the Claude chat plugin file (nim-claude.plugin) and the Codex skills archive
# (nim-codex.zip) from plugins/nim and publishes them with a manifest.json to a GitHub
# Release. Claude Desktop installs a .plugin file from a chat card, which is how chat
# users get the skills without a marketplace. The Codex app and the ChatGPT desktop app
# have no way to add a marketplace without the codex CLI, so their agent unpacks
# nim-codex.zip (skill folders at the archive root) into ~/.agents/skills instead.
# Stable releases are served at
# https://github.com/nim-video/skills/releases/latest/download/nim-claude.plugin
# https://github.com/nim-video/skills/releases/latest/download/nim-codex.zip
# Pre-releases never become "latest", so manual test runs don't affect those links.

on:
  push:
    branches: [main]
    # A version bump touches all five manifests; this one is the plugin's own.
    paths: [plugins/nim/.claude-plugin/plugin.json]
  workflow_dispatch:
    inputs:
      # A choice, not a free-text suffix: `gh workflow run -f x=` drops empty
      # values, so an "empty means stable" input always fell back to its default.
      channel:
        description: prerelease publishes v<version>-test.<run>; stable publishes v<version>.
        type: choice
        options: [prerelease, stable]
        default: prerelease

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and tag
        id: meta
        env:
          SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'prerelease' && format('test.{0}', github.run_number) || '' }}
        run: |
          version=$(jq -r .version plugins/nim/.claude-plugin/plugin.json)
          tag="v${version}${SUFFIX:+-$SUFFIX}"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$([ -n "$SUFFIX" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            # plugin.json changed without a version bump: nothing new to publish.
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::notice::Release $tag already exists, skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Release $tag already exists; bump the plugin version first."
            exit 1
          fi

      - name: Build nim-claude.plugin, nim-codex.zip and manifest.json
        if: steps.meta.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/nim"
          mkdir -p "$stage" dist
          cp -R plugins/nim/.claude-plugin plugins/nim/.mcp.json plugins/nim/skills "$stage/"
          # Stamp the plugin version into every SKILL.md frontmatter (metadata.version), keeping CRLF files CRLF.
          python3 - "$stage/skills" "$VERSION" <<'PY'
          import pathlib, sys
          root, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          for path in sorted(root.glob('*/SKILL.md')):
              raw = path.read_bytes()
              eol = b'\r\n' if b'\r\n' in raw[:200] else b'\n'
              lines = raw.split(eol)
              assert lines[0] == b'---', f'{path}: no frontmatter'
              close = next(i for i in range(1, len(lines)) if lines[i] == b'---')
              assert not any(l.startswith(b'metadata:') for l in lines[1:close]), f'{path}: metadata already set'
              lines[close:close] = [b'metadata:', b'  version: "' + version.encode() + b'"']
              path.write_bytes(eol.join(lines))
              print(f'stamped {path.parent.name}')
          PY
          (cd "$stage" && zip -qr -X "$GITHUB_WORKSPACE/dist/nim-claude.plugin" .claude-plugin .mcp.json skills -x '*.DS_Store')
          # Skill folders at the archive root, so unzipping into ~/.agents/skills installs them.
          (cd "$stage/skills" && zip -qr -X "$GITHUB_WORKSPACE/dist/nim-codex.zip" . -x '*.DS_Store')
          sha=$(sha256sum dist/nim-claude.plugin | cut -d' ' -f1)
          codex_sha=$(sha256sum dist/nim-codex.zip | cut -d' ' -f1)
          # The top-level url/sha256 describe nim-claude.plugin: the Nim backend reads them for
          # check_plugin_update, so keep them when adding fields.
          jq -n --arg v "$VERSION" --arg tag "$TAG" --arg sha "$sha" --arg codex_sha "$codex_sha" \
            --arg repo "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
            '"https://github.com/\($repo)/releases/download/\($tag)" as $base
             | {name: "nim", version: $v, tag: $tag, commit: $commit, sha256: $sha,
                url: "\($base)/nim-claude.plugin",
                artifacts: {
                  claude: {file: "nim-claude.plugin", sha256: $sha, url: "\($base)/nim-claude.plugin"},
                  codex: {file: "nim-codex.zip", sha256: $codex_sha, url: "\($base)/nim-codex.zip"}
                }}' > dist/manifest.json
          cat dist/manifest.json

      - name: Publish GitHub Release
        if: steps.meta.outputs.skip != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/nim-claude.plugin dist/nim-codex.zip dist/manifest.json \
            --target "$GITHUB_SHA" \
            --title "Nim plugin $TAG" \
            --notes "Built from ${GITHUB_SHA::7}. Claude chat: nim-claude.plugin (ask Claude to share it with you, then click Save). Codex and ChatGPT desktop: unzip nim-codex.zip into ~/.agents/skills and add the Nim MCP server (codex mcp add nim --url https://mcp.nim.video/mcp)." \
            "${flags[@]}"
